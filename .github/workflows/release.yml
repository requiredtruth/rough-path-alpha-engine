name: Verify Android and publish release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: roughpath-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Mathematical and native ledger regressions
        run: bash test.sh
      - name: Browser worker and mobile UI tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Release checksum and package identity
        run: |
          cd releases/v1.1.0
          sha256sum -c SHA256SUMS
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('source.zip') as z:
              assert z.testzip() is None
              assert not any(n.endswith(('.jks','.keystore','.pem')) for n in z.namelist())
          with zipfile.ZipFile('RoughPathAlpha.apk') as z:
              assert z.testzip() is None
              assert 'classes.dex' in z.namelist()
              assert 'assets/optimizer.js' in z.namelist()
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 installation, startup, app switch and process restart
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r releases/v1.0.0/RoughPathAlpha.apk
            bash tests/android-startup.sh releases/v1.1.0/RoughPathAlpha.apk
            adb install -r tests/android-worker/test.apk
            adb shell am force-stop com.roughpath.alpha
            adb shell am instrument -w com.roughpath.qa/.WorkerCheck | tee build/android-worker.log
            grep -q 'OK (1 test)' build/android-worker.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-and-android-qa
          path: |
            build/*.png
            build/android-*.log
            build/android-window.xml
      - name: Signature and alignment
        run: |
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$bt/apksigner" verify --verbose releases/v1.1.0/RoughPathAlpha.apk
          "$bt/zipalign" -c -p 4 releases/v1.1.0/RoughPathAlpha.apk
      - name: Publish APK, source ZIP and specification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.0 >/dev/null 2>&1; then
            gh release upload v1.1.0 releases/v1.1.0/{RoughPathAlpha.apk,source.zip,spec.md,SHA256SUMS} --clobber
          else
            gh release create v1.1.0 --target "$GITHUB_SHA" --title 'Rough Path Alpha Engine v1.1.0' --notes-file releases/v1.1.0/notes.md releases/v1.1.0/{RoughPathAlpha.apk,source.zip,spec.md,SHA256SUMS}
          fi

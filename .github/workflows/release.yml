name: Verify Android and publish release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: roughpath-release
  cancel-in-progress: true
jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[audit only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - name: Compile every Android source file
        run: |
          mkdir -p build/compile-check
          javac -source 8 -target 8 -bootclasspath "$ANDROID_HOME/platforms/android-35/android.jar:$ANDROID_HOME/build-tools/35.0.0/core-lambda-stubs.jar" -classpath 'libs/*' -d build/compile-check app/src/main/java/com/roughpath/alpha/*.java
      - name: Mathematical and native ledger regressions
        run: bash test.sh
      - name: Browser worker and mobile UI tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Read-only provider connectivity diagnostics
        run: |
          pids=()
          for probe in probe-network verify-price-pipeline verify-funding-pipeline verify-spot-pipeline verify-backend-pipeline; do
            node "tools/$probe.cjs" > "build/$probe.log" 2>&1 &
            pids+=("$!")
          done
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          cat build/*pipeline.log
          exit "$status"
      - name: Rebuild release source ZIP and checksums from verified tracked files
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import subprocess
          import zipfile

          release = Path('releases/v1.8.6')
          root = Path('rough-path-alpha-engine')
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with zipfile.ZipFile(release / 'source.zip', 'w', zipfile.ZIP_DEFLATED, compresslevel=8) as archive:
              for filename in sorted(filter(None, tracked)):
                  source = Path(filename)
                  if source.parts[0] == 'releases' or not source.is_file():
                      continue
                  if any(part in {'build', 'node_modules', '.gradle', '.git'} for part in source.parts):
                      continue
                  if source.suffix.lower() in {'.jks', '.keystore', '.pem', '.p12', '.pfx'}:
                      raise RuntimeError(f'Refusing to package key material: {source}')
                  payload = release / 'spec.md' if filename == 'spec.md' else source
                  archive.write(payload, (root / source).as_posix())

          files = ['RoughPathAlpha.apk', 'source.zip', 'spec.md']
          (release / 'SHA256SUMS').write_text(''.join(
              hashlib.sha256((release / name).read_bytes()).hexdigest() + '  ' + name + '\n'
              for name in files
          ))
          PY
      - name: Release checksum and package identity
        run: |
          cd releases/v1.8.6
          sha256sum -c SHA256SUMS
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('source.zip') as z:
              assert z.testzip() is None
              assert not any(n.endswith(('.jks','.keystore','.pem')) for n in z.namelist())
          with zipfile.ZipFile('RoughPathAlpha.apk') as z:
              assert z.testzip() is None
              assert 'classes.dex' in z.namelist()
              assert 'assets/optimizer.js' in z.namelist()
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 installation, startup, app switch and process restart
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r releases/v1.8.4/RoughPathAlpha.apk
            bash tests/android-startup.sh releases/v1.8.6/RoughPathAlpha.apk
            adb install -r tests/android-worker/test.apk
            adb shell am force-stop com.roughpath.alpha
            adb shell am instrument -w com.roughpath.qa/.WorkerCheck | tee build/android-worker.log
            grep -q 'OK (1 test)' build/android-worker.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-and-android-qa
          path: |
            build/*.png
            build/android-*.log
            build/android-window.xml
            build/network-audit.json
            build/price-pipeline.json
            build/funding-pipeline.json
            build/spot-pipeline.json
            build/backend-pipeline.json
            build/*pipeline.log
            build/probe-network.log
      - name: Signature and alignment
        run: |
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$bt/apksigner" verify --verbose releases/v1.8.6/RoughPathAlpha.apk
          "$bt/zipalign" -c -p 4 releases/v1.8.6/RoughPathAlpha.apk
      - name: Publish APK, source ZIP and specification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.8.6 >/dev/null 2>&1; then
            gh release upload v1.8.6 releases/v1.8.6/{RoughPathAlpha.apk,source.zip,spec.md,SHA256SUMS} --clobber
          else
            gh release create v1.8.6 --target "$GITHUB_SHA" --title 'Rough Path Alpha Engine v1.8.6' --notes-file releases/v1.8.6/notes.md releases/v1.8.6/{RoughPathAlpha.apk,source.zip,spec.md,SHA256SUMS}
          fi
